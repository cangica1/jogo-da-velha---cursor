<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Jogo da Velha</h1>

    <div id="score" class="score">
      <span>X: <strong id="score-x">0</strong></span>
      <span>O: <strong id="score-o">0</strong></span>
      <span>Velhas: <strong id="score-draws">0</strong></span>
    </div>

    <div id="board" class="board" aria-label="Tabuleiro do jogo da velha"></div>

    <p id="status" class="status">Vez de: X</p>

    <button id="reset-btn" type="button">Nova Partida</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
